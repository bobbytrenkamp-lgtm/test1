name: TEMP diagnose site index failures

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Probe the 4 failed jurisdictions with verbose output
        run: node data/parcel_pipeline/_diagnose_site_index_failures.mjs
