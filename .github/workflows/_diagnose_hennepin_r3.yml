name: (temp) Diagnose Hennepin County MN parcel service (round 3 retry)

# Temporary, workflow_dispatch-only diagnostic re-probing Hennepin
# County MN (63 facilities) after its Metropolitan Council parcel
# candidate returned HTTP 500 "Application Error" on 2026-08-03 (see
# Open Handoffs in AI_TEAM_STATUS.md). Retrying now that time has
# passed, in case it was a transient server-side outage.
# Deleted once this is either added to the registry or re-documented
# as still unavailable.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Retry Hennepin County MN parcel candidates
        run: node data/diagnose_hennepin_r3.mjs
