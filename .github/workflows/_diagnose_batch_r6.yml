name: (temp) Diagnose batch round 6 - disambiguation for Arapahoe CO, DuPage IL, Jefferson AL

# Temporary, workflow_dispatch-only diagnostic getting complete field
# lists and real sample values to disambiguate round 5's leads before
# wiring anything into the registry. See data/diagnose_batch_r6.mjs for
# the full rationale. Deleted once this round's findings are wired into
# the registry or documented as still unresolved.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Probe batch round 6 candidates
        run: node data/diagnose_batch_r6.mjs
