name: (temp) Diagnose DeKalb County GA parcel service

# Temporary, workflow_dispatch-only diagnostic for the next parcel-
# expansion candidate: DeKalb County GA (18 facilities, Atlanta
# metro), the next uninvestigated entry in the facility-count
# priority list after New Castle County DE (added, 44 jurisdictions).
# NOTE: "DeKalb County" exists in multiple states (GA, IL, IN, TN,
# MO, AL) - any candidate must be confirmed as the Georgia one via
# content, not just title match.
# Deleted once this is either added to the registry or documented as
# unavailable.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Probe DeKalb County GA candidates
        run: node data/diagnose_dekalb_ga.mjs
