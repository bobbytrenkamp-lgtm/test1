name: (temp) Diagnose Hudson County NJ parcel service

# Temporary, workflow_dispatch-only diagnostic for the next parcel-
# expansion candidate: Hudson County NJ (21 facilities, Jersey City
# metro), the next uninvestigated entry in the facility-count
# priority list.
# Deleted once this is either added to the registry or documented as
# unavailable.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Probe Hudson County NJ candidates
        run: node data/diagnose_hudson_nj.mjs

      - name: Probe Hudson County NJ candidates (round 2)
        run: node data/diagnose_hudson_nj_r2.mjs

      - name: Probe Hudson County NJ candidates (round 3)
        run: node data/diagnose_hudson_nj_r3.mjs
