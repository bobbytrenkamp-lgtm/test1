name: "TEMP: batch discovery (delete before merge)"

# Same workaround as the earlier _diagnose_discover_batch_live.yml round:
# GitHub only accepts workflow_dispatch API calls for workflow files already
# registered on the default branch, and .github/workflows/
# parcel_batch_discovery.yml hasn't merged to main yet. This is a disposable
# push-triggered stand-in that runs the exact same discover_batch.mjs
# command the permanent workflow runs -- edit BATCH_FIPS below and push to
# run the next round. Deleted once the permanent workflow is dispatchable
# from main (or, worst case, before this PR merges either way).

on:
  push:
    branches:
      - claude/us-datacenter-restrictions-map-skooi7
    paths:
      - .github/workflows/_batch_discovery_temp.yml

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BATCH_FIPS: "31109,36059,26125,36103,51047,53007,19155,19113,18059,37035,45015,55101,47125,49049,54061,09009,01101,22033,19169,36047,51119,17197,26081,47065,01089,17167,34035,53061,27137,37067"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run discover_batch.mjs
        run: node data/parcel_pipeline/discover_batch.mjs --fips "$BATCH_FIPS" --max-candidates 8 --concurrency 3

      - name: Locate this run's output directory
        id: rundir
        if: always()
        run: |
          DIR=$(ls -td data/parcel_pipeline/output/*/ 2>/dev/null | head -n1)
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Write step summary
        if: always() && steps.rundir.outputs.dir != ''
        run: |
          SUMMARY="${{ steps.rundir.outputs.dir }}summary.md"
          if [ -f "$SUMMARY" ]; then
            cat "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No summary.md found at $SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload full run output as an artifact
        if: always() && steps.rundir.outputs.dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: batch-discovery-${{ github.run_id }}
          path: ${{ steps.rundir.outputs.dir }}
          retention-days: 14
          if-no-files-found: warn

      # The artifact above lives on a blob-storage host the sandbox's egress
      # proxy doesn't allow fetching directly, so this dumps the same data
      # (minus bulky sampleRecords, which none of the local review tooling
      # needs) straight to the job log instead -- that only requires the
      # already-authorized GitHub API to read back.
      - name: Dump targets + candidates (sampleRecords stripped) to the log
        if: always() && steps.rundir.outputs.dir != ''
        run: |
          DIR="${{ steps.rundir.outputs.dir }}"
          for f in "$DIR"targets/*.json; do
            [ -f "$f" ] || continue
            echo "===FILE: targets/$(basename "$f")==="
            cat "$f"
            echo
          done
          for f in "$DIR"candidates/*.json; do
            [ -f "$f" ] || continue
            echo "===FILE: candidates/$(basename "$f")==="
            node -e "const c = JSON.parse(require('fs').readFileSync('$f', 'utf8')); delete c.sampleRecords; console.log(JSON.stringify(c));"
            echo
          done
