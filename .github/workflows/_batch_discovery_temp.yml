name: "TEMP: batch discovery (delete before merge)"

# Same workaround as the earlier _diagnose_discover_batch_live.yml round:
# GitHub only accepts workflow_dispatch API calls for workflow files already
# registered on the default branch, and .github/workflows/
# parcel_batch_discovery.yml hasn't merged to main yet. This is a disposable
# push-triggered stand-in that runs the exact same discover_batch.mjs
# command the permanent workflow runs -- edit BATCH_FIPS below and push to
# run the next round. Deleted once the permanent workflow is dispatchable
# from main (or, worst case, before this PR merges either way).

on:
  push:
    branches:
      - claude/us-datacenter-restrictions-map-skooi7
    paths:
      - .github/workflows/_batch_discovery_temp.yml

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BATCH_FIPS: "08031,29095,29510,37063,40109,05119,40143,09001,46099,35001,20091,29189,33011,28049,06073"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run discover_batch.mjs
        run: node data/parcel_pipeline/discover_batch.mjs --fips "$BATCH_FIPS" --max-candidates 8 --concurrency 3

      - name: Locate this run's output directory
        id: rundir
        if: always()
        run: |
          DIR=$(ls -td data/parcel_pipeline/output/*/ 2>/dev/null | head -n1)
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Write step summary
        if: always() && steps.rundir.outputs.dir != ''
        run: |
          SUMMARY="${{ steps.rundir.outputs.dir }}summary.md"
          if [ -f "$SUMMARY" ]; then
            cat "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No summary.md found at $SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload full run output as an artifact
        if: always() && steps.rundir.outputs.dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: batch-discovery-${{ github.run_id }}
          path: ${{ steps.rundir.outputs.dir }}
          retention-days: 14
          if-no-files-found: warn
