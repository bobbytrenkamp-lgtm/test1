name: (temp) Diagnose batch round 3 - Mecklenburg NC follow-up, Denver CO search

# Temporary, workflow_dispatch-only diagnostic following up on round 2's
# findings: Mecklenburg NC's real county-owned "Tax Parcel Boundaries"
# service, and a properly scoped ArcGIS Online search for Denver CO. See
# data/diagnose_batch_r3.mjs for the full rationale. Deleted once this
# round's findings are wired into the registry or documented as still
# unresolved.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Probe batch round 3 candidates
        run: node data/diagnose_batch_r3.mjs
