name: (temp) Diagnose Santa Clara County parcel service

# Temporary, workflow_dispatch-only diagnostic. Retries the Santa Clara
# County CA candidate parcel service with a longer timeout (its first probe,
# run alongside the Maricopa/Dallas/Fulton batch, timed out inconclusively),
# plus checks an ArcGIS Hub alternate. Deleted once Santa Clara is either
# added to the registry or documented as unavailable.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Probe Santa Clara candidates
        run: node data/diagnose_santa_clara.mjs
