name: TEMP diagnose regional fiber expansion candidates

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Probe candidate regional fiber/conduit GIS sources
        run: python3 data/_diagnose_fiber_expansion.py

      - name: Round 2 -- description/licensing/count detail on real candidates
        run: python3 data/_diagnose_fiber_expansion_r2.py

      - name: Round 3 -- verify f=geojson bbox query shape before wiring
        run: python3 data/_diagnose_fiber_expansion_r3.py
