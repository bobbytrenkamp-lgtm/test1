name: (temp) Diagnose Denver County CO parcel service (round 3)

# Temporary, workflow_dispatch-only diagnostic re-probing Denver
# County CO (62 facilities, #8 by facility count) after it was left
# "Open, not added" in AI_TEAM_STATUS.md's Open Handoffs following 2
# rounds run 2026-08-03. Round 1 got a raw fetch failure (not a 404)
# at gis.denvergov.org, so reachability was never confirmed one way
# or the other; round 2 exhausted Denver's ArcGIS Online org with no
# hit. This round retries the direct host and checks the Open Data
# Catalog.
# Deleted once this is either added to the registry or re-documented
# as unavailable.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Probe Denver County CO candidates (round 3)
        run: node data/diagnose_denver_co_r3.mjs
