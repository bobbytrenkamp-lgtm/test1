name: (temp) Diagnose San Francisco County parcel service

# Temporary, workflow_dispatch-only diagnostic for the next parcel-
# expansion candidate: San Francisco County CA (39 facilities), the
# next uninvestigated county in the facility-count priority list after
# Bexar County TX. Deleted once this is either added to the registry or
# documented as unavailable.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Probe San Francisco County candidates
        run: node data/diagnose_sf.mjs
