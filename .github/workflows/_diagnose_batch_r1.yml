name: (temp) Diagnose batch round 1 - Essex NJ, Baltimore City MD, Prince George's MD

# Temporary, workflow_dispatch-only diagnostic checking whether 3 of the
# next highest-priority uncovered counties (per
# data/parcel_priority_queue.py) can reuse already-proven-live registry
# services rather than needing fresh discovery. See
# data/diagnose_batch_r1.mjs for the full rationale per county.
# Deleted once this round's findings are wired into the registry or
# documented as unavailable.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Probe batch round 1 candidates
        run: node data/diagnose_batch_r1.mjs
