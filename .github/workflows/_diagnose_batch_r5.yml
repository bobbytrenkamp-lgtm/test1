name: (temp) Diagnose batch round 5 - schema confirmation for Arapahoe CO, DuPage IL, Jefferson AL, Durham NC

# Temporary, workflow_dispatch-only diagnostic confirming real field
# schemas for round 4's promising leads. See data/diagnose_batch_r5.mjs
# for the full rationale. Deleted once this round's findings are wired
# into the registry or documented as still unresolved.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Probe batch round 5 candidates
        run: node data/diagnose_batch_r5.mjs
