name: (temp) Diagnose Hennepin County parcel service

# Temporary, workflow_dispatch-only diagnostic for the next parcel-
# expansion candidate: Hennepin County MN (63 facilities), the next
# county in the facility-count priority list after Los Angeles CA.
# Deleted once this is either added to the registry or documented as
# unavailable.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Probe Hennepin County candidates
        run: node data/diagnose_hennepin.mjs
