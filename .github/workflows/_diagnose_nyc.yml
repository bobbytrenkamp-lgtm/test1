name: (temp) Diagnose New York County parcel service

# Temporary, workflow_dispatch-only diagnostic for the next parcel-
# expansion candidate: New York County NY / Manhattan (52 facilities),
# the next uninvestigated county in the facility-count priority list
# (Cook County IL, Santa Clara CA, Hennepin MN, and Denver CO are
# already documented/blocked). Deleted once this is either added to the
# registry or documented as unavailable.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Probe NYC candidates
        run: node data/diagnose_nyc.mjs
