name: (temp) Diagnose Duval County FL parcel service

# Temporary, workflow_dispatch-only diagnostic for the next parcel-
# expansion candidate: Duval County FL / Jacksonville (22 facilities),
# the next uninvestigated entry in the facility-count priority list
# after District of Columbia.
# Deleted once this is either added to the registry or documented as
# unavailable.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Probe Duval County FL candidates
        run: node data/diagnose_duval_fl.mjs
