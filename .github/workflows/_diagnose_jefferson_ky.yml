name: (temp) Diagnose Jefferson County KY parcel service

# Temporary, workflow_dispatch-only diagnostic for the next parcel-
# expansion candidate: Jefferson County KY / Louisville (22
# facilities, tied with Duval County FL), the next uninvestigated
# entry in the facility-count priority list.
# Deleted once this is either added to the registry or documented as
# unavailable.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Probe Jefferson County KY candidates
        run: node data/diagnose_jefferson_ky.mjs
