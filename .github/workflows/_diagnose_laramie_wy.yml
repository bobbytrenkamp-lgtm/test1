name: (temp) Diagnose Laramie County WY parcel service

# Temporary, workflow_dispatch-only diagnostic for the next parcel-
# expansion candidate: Laramie County WY (19 facilities, Cheyenne
# metro), the next uninvestigated entry in the facility-count
# priority list after Washoe County NV (added, 42 jurisdictions).
# Deleted once this is either added to the registry or documented as
# unavailable.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Probe Laramie County WY candidates
        run: node data/diagnose_laramie_wy.mjs

      - name: Probe Laramie County WY candidates (round 2)
        run: node data/diagnose_laramie_wy_r2.mjs
