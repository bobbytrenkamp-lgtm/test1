name: Check Source Link Health

# The site claims policy records are "verified from primary government sources"
# and links out to them. A validation run found roughly two in five of those
# citations unreachable. This checks them on a rolling basis and records a
# Wayback fallback so a moved page still has a readable citation, plus (for
# dead links on sites with an XML sitemap) a best-effort "may have moved to"
# suggestion based on path-keyword overlap — see check_source_links.py's
# module docstring for how that heuristic works.
#
# Runs weekly, in slices, so no host is hammered and the whole corpus is
# revisited roughly monthly. The county-citation job never modifies
# map_data.json — link health is written to its own derived file.
#
# check_map_data_citations is the map_data_citations equivalent (a larger
# corpus: county sources plus every facility-layer and state-regulation
# source, via data/validate_sources.py). It only runs on a manual dispatch,
# not the weekly cron — data/validate_sources.py already runs weekly in
# production via update_data.yml (which is deliberately pinned to main, see
# that workflow's own comments); this job exists so the same check can also
# be run, live, against a feature branch on demand for a remediation pass,
# without duplicating validate_sources.py's production cadence here.

on:
  schedule:
    - cron: "17 4 * * 1"        # Mondays, 04:17 UTC
  workflow_dispatch:
    inputs:
      limit:
        description: "Max URLs to check this run (0 = all)"
        required: false
        default: "600"
      max_age_days:
        description: "Skip URLs checked within this many days"
        required: false
        default: "14"

permissions:
  contents: write

concurrency:
  group: source-link-check
  cancel-in-progress: false

jobs:
  check_county_citations:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check citation links
        run: |
          python data/check_source_links.py \
            --limit "${{ github.event.inputs.limit || 600 }}" \
            --max-age-days "${{ github.event.inputs.max_age_days || 14 }}" \
            --workers 8 \
            --timeout 15

      # The script exits 2 and writes nothing if every request failed at the
      # connection layer, which means the runner's network is broken rather
      # than the government sites. Treat that as a failed run, not a data update.
      - name: Commit link health
        run: |
          if [ ! -f data/source_link_health.json ]; then
            echo "No health file produced — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/source_link_health.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            git commit -m "chore: refresh source link health [${TIMESTAMP}] [skip ci]"
            # Rebase against whatever branch this run actually checked out —
            # this workflow supports workflow_dispatch against any ref, not
            # just main, so hardcoding "main" here rebases onto unrelated
            # history and corrupts the retry the moment this runs against a
            # feature branch with its own concurrent commits (found via a
            # real failure: 2026-07-29 run on a feature branch hit dozens of
            # add/add conflicts against main and aborted).
            for attempt in 1 2 3 4 5; do
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then break; fi
              if [ "$attempt" = 5 ]; then echo "::error::Push failed after 5 attempts."; exit 1; fi
              echo "Push rejected (attempt ${attempt}), rebasing and retrying..."
              git fetch origin "${GITHUB_REF_NAME}" && git rebase "origin/${GITHUB_REF_NAME}"
              sleep $((attempt * 5))
            done
          fi

      - name: Summary
        if: always()
        run: |
          if [ -f data/source_link_health.json ]; then
            python data/check_source_links.py --report-only
          fi

  check_map_data_citations:
    # Manual dispatch only -- see the header comment above for why this
    # doesn't also run on the weekly cron. Two live runs (2026-08-20) tried
    # checking the FULL ~2,949-URL corpus every dispatch and got cancelled
    # at both a 30- and a 50-minute job timeout without committing anything
    # -- validate_sources.py now supports the same --limit/--max-age-days
    # rolling-window slicing check_source_links.py already uses (reusing
    # this workflow's existing `limit`/`max_age_days` inputs below), so a
    # single dispatch only checks what's actually due and the full corpus
    # gets covered incrementally across repeated dispatches/scheduled runs,
    # the same way county citations already work.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Exits 1 if broken URLs were found -- that's a report, not a failed
      # run, so don't let it fail the job.
      - name: Validate map_data_citations (county + facility + state sources)
        continue-on-error: true
        run: |
          python data/validate_sources.py \
            --limit "${{ github.event.inputs.limit || 600 }}" \
            --max-age-days "${{ github.event.inputs.max_age_days || 14 }}" \
            --workers 8 \
            --timeout 15

      - name: Commit validation report + citation health
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/map_data.json data/map_data_citation_health.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            git commit -m "chore: refresh map_data citation validation [${TIMESTAMP}] [skip ci]"
            # Same any-ref-safe retry pattern as check_county_citations above.
            for attempt in 1 2 3 4 5; do
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then break; fi
              if [ "$attempt" = 5 ]; then echo "::error::Push failed after 5 attempts."; exit 1; fi
              echo "Push rejected (attempt ${attempt}), rebasing and retrying..."
              git fetch origin "${GITHUB_REF_NAME}" && git rebase "origin/${GITHUB_REF_NAME}"
              sleep $((attempt * 5))
            done
          fi

  check_policy_sources:
    # Manual dispatch only, same reasoning as check_map_data_citations
    # above: data/run_policy_pipeline.py already runs daily in production
    # via update_policy_sources.yml, which is deliberately pinned to main
    # (same "production data bot" reasoning as update_data.yml). That
    # means a dispatch against main never actually exercises whatever
    # diagnostic code only exists on a feature branch -- e.g. the
    # response-body-snippet capture added here 2026-08-19 to tell
    # ACCESS_BLOCKED (a WAF/challenge page) apart from a genuinely dead
    # source, which 16 of the persistently-down policy sources were
    # provisionally classified as without ever having been confirmed by an
    # actual run with that capture in place. --check-health-only only
    # updates data/source_health.json -- no adapters, no candidate
    # discovery, no issue creation -- so it's safe to run here.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r data/requirements.txt

      - name: Check policy source health only
        working-directory: data
        continue-on-error: true
        run: python run_policy_pipeline.py --check-health-only

      - name: Commit source health
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/source_health.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            git commit -m "chore: refresh policy source health [${TIMESTAMP}] [skip ci]"
            for attempt in 1 2 3 4 5; do
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then break; fi
              if [ "$attempt" = 5 ]; then echo "::error::Push failed after 5 attempts."; exit 1; fi
              echo "Push rejected (attempt ${attempt}), rebasing and retrying..."
              git fetch origin "${GITHUB_REF_NAME}" && git rebase "origin/${GITHUB_REF_NAME}"
              sleep $((attempt * 5))
            done
          fi
