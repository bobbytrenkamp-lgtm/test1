name: (temp) Diagnose Sacramento County parcel service

# Temporary, workflow_dispatch-only diagnostic for the next parcel-
# expansion candidate: Sacramento County CA (30 facilities), the next
# uninvestigated county in the facility-count priority list after
# Philadelphia PA.
# Deleted once this is either added to the registry or documented as
# unavailable.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Probe Sacramento County candidates
        run: node data/diagnose_sacramento.mjs
