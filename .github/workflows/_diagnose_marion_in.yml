name: (temp) Diagnose Marion County IN parcel service

# Temporary, workflow_dispatch-only diagnostic for the next parcel-
# expansion candidate: Marion County IN / Indianapolis (24
# facilities), the next uninvestigated county in the facility-count
# priority list after Allegheny County PA.
# Deleted once this is either added to the registry or documented as
# unavailable.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Probe Marion County IN candidates
        run: node data/diagnose_marion_in.mjs
