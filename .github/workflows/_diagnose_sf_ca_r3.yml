name: (temp) Diagnose San Francisco County CA parcel service (round 3)

# Temporary, workflow_dispatch-only diagnostic re-probing San
# Francisco County CA (39 facilities) after 2 rounds (2026-08-03)
# found a real, live DataSF Socrata dataset with parcel/zoning fields
# but no owner/value/legal data (California law prohibits SF's
# Assessor-Recorder from posting ownership info online). This round
# checks whether the "ASR Mapping" hub is a genuine ArcGIS-native SF
# Assessor-Recorder service under a not-yet-tried account.
# Deleted once this is either added to the registry or re-documented
# as unavailable/deliberately excluded.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Probe San Francisco County CA candidates (round 3)
        run: node data/diagnose_sf_ca_r3.mjs

      - name: Probe San Francisco County CA candidates (round 4)
        run: node data/diagnose_sf_ca_r4.mjs
