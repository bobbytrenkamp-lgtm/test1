name: Update Zoning Data

on:
  schedule:
    # Run weekly on Wednesday at 05:00 UTC — zoning ordinances change infrequently
    - cron: "0 5 * * 3"
  workflow_dispatch:
    inputs:
      jurisdiction:
        description: "Jurisdiction ID (e.g. va-loudoun-county; leave blank for all)"
        required: false
        default: ""
      skip_fetch:
        description: "Skip geometry download (only re-export structured data)"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: write

jobs:
  update-zoning:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      # Deliberately pinned to main regardless of how this run was
      # triggered (including workflow_dispatch against a feature
      # branch) — this is a production data bot, not a per-branch CI
      # check, and must always compute from and push back to main so
      # a manual dispatch from a stale/experimental branch can never
      # commit that branch's state onto production data. The commit
      # step below pushes to main to match, on purpose — don't
      # "fix" one without the other.
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run zoning pipeline
        working-directory: data/zoning/scripts
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.jurisdiction }}" ]; then
            ARGS="$ARGS --jurisdiction ${{ github.event.inputs.jurisdiction }}"
          fi
          if [ "${{ github.event.inputs.skip_fetch }}" = "true" ]; then
            ARGS="$ARGS --skip-fetch"
          fi
          python run_zoning_pipeline.py $ARGS
        continue-on-error: true

      - name: Validate output files
        run: |
          python - <<'EOF'
          import json, sys, pathlib
          normalized_dir = pathlib.Path("data/zoning/normalized")
          files = list(normalized_dir.glob("*.json"))
          if not files:
            print("No normalized files to validate")
            sys.exit(0)
          errors = 0
          for f in files:
            data = json.loads(f.read_text())
            if "districts" not in data:
              print(f"ERROR: {f.name} missing 'districts'")
              errors += 1
            if "jurisdiction" not in data:
              print(f"ERROR: {f.name} missing 'jurisdiction'")
              errors += 1
            if "disclaimer" not in data:
              print(f"ERROR: {f.name} missing 'disclaimer'")
              errors += 1
            dc = sum(1 for d in data.get("districts",{}).values() if d.get("dc_analysis"))
            print(f"OK: {f.name} — {len(data.get('districts',{}))} districts, {dc} with DC analysis")
          if errors:
            sys.exit(1)
          EOF

      - name: Commit updated zoning data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # `git add` on a path that doesn't exist at all (not even as an
          # empty dir) fails the whole command with "pathspec did not match
          # any files" — confirmed happening on every run because no county
          # has ever produced real ArcGIS geometry, so data/zoning/geometry/
          # has never existed. Bundled into one git-add call under bash -e,
          # that one missing path aborted the step before it could add the
          # directories that DID have real, legitimate updates (e.g.
          # Loudoun's normalized/jurisdictions/validation output), so
          # nothing ever got committed on any run. Only add paths that
          # currently exist.
          ZONING_PATHS=""
          for d in data/zoning/normalized data/zoning/geometry data/zoning/jurisdictions data/zoning/validation; do
            [ -d "$d" ] && ZONING_PATHS="$ZONING_PATHS $d/"
          done
          if [ -z "$ZONING_PATHS" ]; then
            echo "No zoning output directories exist — nothing to add"
          else
            git add $ZONING_PATHS
          fi
          if git diff --cached --quiet; then
            echo "No zoning data changes to commit"
          else
            TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            git commit -m "chore: update zoning data [${TIMESTAMP}] [skip ci]"
            for attempt in 1 2 3 4 5; do
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" = 5 ]; then echo "::error::Push failed after 5 attempts."; exit 1; fi
              echo "Push rejected (attempt ${attempt}), rebasing and retrying..."
              git fetch origin main && git rebase origin/main
              sleep $((attempt * 5))
            done
          fi
