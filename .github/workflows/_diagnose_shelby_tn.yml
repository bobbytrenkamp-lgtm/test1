name: (temp) Diagnose Shelby County TN parcel service

# Temporary, workflow_dispatch-only diagnostic for the next parcel-
# expansion candidate: Shelby County TN (20 facilities, Memphis
# metro), the next uninvestigated entry in the facility-count
# priority list.
# Deleted once this is either added to the registry or documented as
# unavailable.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Probe Shelby County TN candidates
        run: node data/diagnose_shelby_tn.mjs

      - name: Probe Shelby County TN candidates (round 2)
        run: node data/diagnose_shelby_tn_r2.mjs
