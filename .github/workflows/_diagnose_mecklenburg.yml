name: (temp) Diagnose Mecklenburg County parcel service

# Temporary, workflow_dispatch-only diagnostic for the next parcel-
# expansion candidate: Mecklenburg County NC / Charlotte (39
# facilities), the next uninvestigated county in the facility-count
# priority list after San Francisco CA (documented as blocked).
# Deleted once this is either added to the registry or documented as
# unavailable.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Probe Mecklenburg County candidates
        run: node data/diagnose_mecklenburg.mjs
