name: TEMP diagnose VA parcel enrichment candidates

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Probe VA enrichment candidates
        run: node data/_diagnose_va_enrichment.mjs
