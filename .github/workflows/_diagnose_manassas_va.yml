name: (temp) Diagnose Manassas city VA parcel service

# Temporary, workflow_dispatch-only diagnostic for the next parcel-
# expansion candidate: Manassas city VA (18 facilities), the next
# uninvestigated entry in the facility-count priority list after
# Douglas County NE (added, 46 jurisdictions).
# NOTE: Manassas is an independent city, not a county - distinct from
# the separate Manassas Park city and from the surrounding Prince
# William County. Any candidate must be confirmed as Manassas city
# specifically.
# Deleted once this is either added to the registry or documented as
# unavailable.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Probe Manassas city VA candidates
        run: node data/diagnose_manassas_va.mjs

      - name: Probe Manassas city VA candidates (round 2)
        run: node data/diagnose_manassas_va_r2.mjs

      - name: Probe Manassas city VA candidates (round 3)
        run: node data/diagnose_manassas_va_r3.mjs
