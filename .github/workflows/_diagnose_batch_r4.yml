name: (temp) Diagnose batch round 4 - Arapahoe CO, DuPage IL, Jefferson AL, St Louis city MO, Durham NC

# Temporary, workflow_dispatch-only diagnostic doing fresh discovery for
# 5 new candidates from the priority queue, using the ArcGIS Online item
# search approach that worked well for Mecklenburg NC this session. See
# data/diagnose_batch_r4.mjs for the full rationale. Deleted once this
# round's findings are wired into the registry or documented as still
# unresolved.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Probe batch round 4 candidates
        run: node data/diagnose_batch_r4.mjs
