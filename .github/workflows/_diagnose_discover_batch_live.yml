name: "TEMP: live verification of discover_batch.mjs (delete before merge)"

# One-off manual dispatch to prove data/parcel_pipeline/discover_batch.mjs's
# adapters actually round-trip real ArcGIS Online/DCAT/CKAN/Socrata responses
# from live third-party endpoints -- this sandbox's outbound HTTPS to those
# endpoints returns 403, so the unit test suite (which mocks the network
# boundary) can prove the retry/scoring/parsing/orchestration LOGIC is
# correct but cannot prove the adapters correctly parse what a real server
# returns today. This workflow is the same "dispatch, read the uploaded
# artifact by hand" pattern check_parcel_services.mjs and parcel_pr_check.yml
# were themselves validated with. Deleted once PR A+B's live verification is
# confirmed -- this is NOT the permanent batch-discovery workflow (that is
# PR C's .github/workflows/parcel_batch_discovery.yml, not built yet).

on:
  workflow_dispatch:
    inputs:
      fips:
        description: "Comma-separated FIPS codes to run discovery against"
        required: false
        default: "37063,29510"
  # workflow_dispatch alone can't be triggered via the API until this file
  # exists on the default branch. push-triggered runs use the workflow file
  # as committed on the pushed branch itself, so this also fires directly on
  # push to this scratch branch -- a genuine "disposable scratch-branch
  # dispatch" per the plan, no merge to main required.
  push:
    branches:
      - claude/us-datacenter-restrictions-map-skooi7

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run discover_batch.mjs against real live endpoints
        run: |
          node data/parcel_pipeline/discover_batch.mjs \
            --fips "${{ github.event.inputs.fips || '37063,29510' }}" \
            --max-candidates 6 \
            --concurrency 2

      - name: Upload full run output as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discover-batch-live-output
          path: data/parcel_pipeline/output/
          retention-days: 7
          if-no-files-found: warn
