name: Update Facility Dataset

on:
  schedule:
    # Run weekly on Sunday at 03:00 UTC — facility data changes slowly
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      source:
        description: "Source ID to run (leave blank for all)"
        required: false
        default: ""
      full:
        description: "Force full pull (true/false)"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  update-facilities:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r data/requirements.txt

      - name: Seed master dataset if absent
        run: |
          if [ ! -s data/facilities_master.json ] || [ "$(cat data/facilities_master.json)" = "[]" ]; then
            echo "Master dataset is empty — running seed script"
            python data/seed_facilities.py
          else
            echo "Master dataset exists, skipping seed"
          fi

      # No env secrets: every facility source is a free, unauthenticated public
      # dataset. A paid aggregator integration that used to be wired here was
      # removed — see the Cost & Licensing Audit in DATA_SOURCES.md.
      # tests/test_no_paid_dependencies.py fails if a paid service reappears.
      - name: Run facility pipeline
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.source }}" ]; then
            ARGS="$ARGS --source ${{ github.event.inputs.source }}"
          fi
          if [ "${{ github.event.inputs.full }}" = "true" ]; then
            ARGS="$ARGS --full"
          fi
          python data/run_facility_pipeline.py $ARGS

      # Promotes the subset of pipeline candidates that are conservatively
      # verifiable as distinct new facilities (see the module docstring for
      # the exact rule) rather than leaving every review-required record to
      # accumulate unreviewed indefinitely, which is what happened before
      # this step existed (2,112 candidates had built up with zero review).
      - name: Review and promote safe facility candidates
        run: python data/review_facility_candidates.py

      - name: Export facilities to map layers
        run: python data/export_facilities_to_layers.py

      # The browser loads facilities_index.json, not the master file. Rebuild it
      # here or the site serves a stale facility list.
      - name: Rebuild facilities index
        run: python data/build_facilities_index.py

      # platform_metadata.json is the source of truth the frontend reads facility
      # counts from instead of downloading the master file. It must be
      # regenerated here or Home silently shows stale totals.
      - name: Refresh platform metadata
        run: python data/refresh_platform_metadata.py

      - name: Validate platform metadata
        run: python data/validate_platform_metadata.py

      - name: Split layers for browser lazy-loading
        run: python data/split_sample_layers.py

      - name: Commit updated facility data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            data/facilities_master.json \
            data/facilities_candidates.json \
            data/facilities_changelog.json \
            data/facilities_sync_state.json \
            data/facilities_version_history/ \
            data/sample_layers.json \
            data/layers/ \
            data/facilities_index.json \
            data/platform_metadata.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            git commit -m "chore: update facility dataset [${TIMESTAMP}] [skip ci]"
            for attempt in 1 2 3 4 5; do
              if git push origin HEAD; then break; fi
              if [ "$attempt" = 5 ]; then echo "::error::Push failed after 5 attempts."; exit 1; fi
              echo "Push rejected (attempt ${attempt}), rebasing and retrying..."
              git fetch origin "${GITHUB_REF_NAME}" && git rebase "origin/${GITHUB_REF_NAME}"
              sleep $((attempt * 5))
            done
          fi
