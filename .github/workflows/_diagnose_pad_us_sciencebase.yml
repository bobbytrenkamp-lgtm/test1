name: TEMP diagnose PAD-US ScienceBase static download

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Probe ScienceBase for a real PAD-US static download path
        run: python3 data/_diagnose_pad_us_sciencebase.py

      - name: Round 2 -- retry with a longer timeout, plus a domain-reachability control
        run: python3 data/_diagnose_pad_us_sciencebase_r2.py
