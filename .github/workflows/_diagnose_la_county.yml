name: (temp) Diagnose LA County parcel service

# Temporary, workflow_dispatch-only diagnostic for the next parcel-
# expansion candidate: Los Angeles County CA (64 facilities), the next
# county in the facility-count priority list after Franklin OH / King WA.
# Deleted once this is either added to the registry or documented as
# unavailable.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Probe LA County candidates
        run: node data/diagnose_la_county.mjs
