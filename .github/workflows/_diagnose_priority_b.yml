name: TEMP - Diagnose Priority B sources

# Temporary, one-off diagnostic workflow -- probes the Jefferson County KY
# (LOJIC) parcel endpoint and 17 flagged-down policy sources from a runner
# with real outbound network access (this sandbox has none). Read-only:
# never commits, never writes to the repository. Deleted once its findings
# are hand-transcribed into js/parcel/registry.js / government_sources.json,
# matching this repo's established temp-diagnostic-workflow pattern.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run diagnostic probe
        run: python3 data/_tmp_diagnose_priority_b.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: priority-b-report-${{ github.run_id }}
          path: priority_b_report.json
          retention-days: 14
