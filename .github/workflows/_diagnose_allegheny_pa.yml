name: (temp) Diagnose Allegheny County PA parcel service

# Temporary, workflow_dispatch-only diagnostic for the next parcel-
# expansion candidate: Allegheny County PA / Pittsburgh (25
# facilities), the next uninvestigated county in the facility-count
# priority list after Hamilton County OH.
# Deleted once this is either added to the registry or documented as
# unavailable.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Probe Allegheny County PA candidates
        run: node data/diagnose_allegheny_pa.mjs
