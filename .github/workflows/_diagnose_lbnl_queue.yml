name: TEMP diagnose LBNL interconnection queue source

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install openpyxl
        run: pip install openpyxl

      - name: Install Playwright + Chromium
        run: |
          npm init -y > /dev/null
          npm install playwright
          npx playwright install --with-deps chromium

      # Round 1/2 (plain HTTP GET, then with realistic browser headers) both
      # got a Cloudflare "Just a moment..." managed-challenge page
      # (Cf-Mitigated: challenge) on emp.lbl.gov/eta.lbl.gov -- that can only
      # be resolved by a real browser executing the challenge's JS, not by
      # tuning request headers further.
      - name: Find the real download link via a real browser (Cloudflare challenge)
        run: node data/_diagnose_lbnl_queue_browser.mjs

      - name: Inspect the downloaded workbook
        if: success()
        run: python3 data/_diagnose_lbnl_queue_inspect.py
