name: (temp) Diagnose Douglas County NE parcel service

# Temporary, workflow_dispatch-only diagnostic for the next parcel-
# expansion candidate: Douglas County NE (18 facilities, Omaha
# metro), the next uninvestigated entry in the facility-count
# priority list after DeKalb County GA (added, 45 jurisdictions).
# NOTE: "Douglas County" exists in many states (NE, CO, KS, OR, WA,
# MN, WI, GA, MO, IL, and others) - any candidate must be confirmed
# as the Nebraska one via content, not just title match.
# Deleted once this is either added to the registry or documented as
# unavailable.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Probe Douglas County NE candidates
        run: node data/diagnose_douglas_ne.mjs
