name: Update Economic Data

# Builds the Economy tab's local JSON from the FRED and Census APIs.
#
# WHY A SINGLE DAILY JOB SERVES SIX CADENCES
# FRED series publish daily-to-monthly, so they are refreshed on every run.
# Census ACS publishes ONE new 5-year vintage per year, so re-downloading
# ~3,140 counties every day would burn CI minutes for no new data. The script
# reads census.last_successful_update from economic_metadata.json and skips
# Census unless it is older than --census-max-age-days (7). Building Permits
# (via FRED, one series PER COUNTY — see collect_permits in
# data/update_economic_data.py) is on its own, much longer gate
# (--permits-max-age-days, 30): BPS publishes annually and a full permits run
# is ~3,000 individual requests, so it must not repeat on FRED's own daily
# cadence. EIA electricity price (state-level, one request for all states) has
# its own 30-day gate too (--eia-max-age-days) since EIA updates monthly, not
# daily or annually. BLS QCEW average weekly wage (one request PER COUNTY,
# same shape as Building Permits) has the longest gate of all
# (--bls-max-age-days, 90): its annual file publishes with a 5-6 month lag, so
# there is nothing new to fetch on any shorter interval. FEMA's National Risk
# Index (one bulk request for the whole country, like EIA) has the longest
# gate of all (--nri-max-age-days, 180): FEMA republishes it infrequently
# (documented versions are roughly annual). Every module has its own
# timestamp field, even where an interval happens to match another module's,
# so none can silently ride on a sibling's gate (the bug PEP had against ACS
# before it was retired). All checks live in one scheduled job rather than
# separate workflows.
#
# FEMA NRI's confidence level is lower than this workflow's other sources:
# its exact CSV column names were not independently fetched and confirmed
# before this module shipped (network access was blocked in the session that
# wrote it — see AI_CHANGELOG.md and DATA_SOURCES.md). If nri_available stays
# false after a run with --force-nri, check the warning text first; it names
# exactly which column names it tried and what the file's real header was.
#
# A Census Population Estimates Program (PEP) module was tried and retired:
# a live bounded test showed every vintage year returning a plain HTTP 404 on
# Census's Data API — not an auth problem, but Census having discontinued
# that endpoint for current-year total population (vintage 2022+). See
# AI_CHANGELOG.md for the investigation. ACS's own `population` metric (a
# 5-year rolling average) remains the platform's population figure.
#
# API KEYS
# FRED and Census are FREE registrations at two different agencies and both
# REQUIRED in practice. EIA is a third free registration and OPTIONAL — its
# module simply does not run without it, the same as any other missing
# optional key. BLS QCEW needs NO key or registration at all (its open-data
# CSV endpoint is fully public). No key is interchangeable with another and
# none can be billed. Keys live in repository secrets and are passed only as
# env vars to the Python step — never echoed, never written to an output
# file, and any URL reaching a log line is redacted by _redact().
#   FRED_API_KEY    REQUIRED. https://fred.stlouisfed.org/docs/api/api_key.html
#   CENSUS_API_KEY  REQUIRED. https://api.census.gov/data/key_signup.html
#   EIA_API_KEY     OPTIONAL. https://www.eia.gov/opendata/register.php
#   (BLS QCEW needs no key — https://www.bls.gov/cew/additional-resources/open-data/)
#   (FEMA NRI needs no key either — https://hazards.fema.gov/nri/)
#
# MISSING KEY BEHAVIOUR
# A missing key skips that source with a warning and preserves the previously
# committed data untouched, the same for every keyed source. FRED has always
# rejected keyless requests. Census allowed roughly 500 unauthenticated
# requests/day until May 12, 2026, when it began requiring a key for every
# Data API request (this covers ACS and CBP). No missing key fails the job;
# it fails only when output validation says the generated data would be
# corrupt.

on:
  schedule:
    # 06:20 UTC daily. Offset off the hour so it does not collide with the
    # other data workflows in this repo.
    - cron: "20 6 * * *"
  workflow_dispatch:
    inputs:
      force_census:
        description: "Refresh Census even if it was updated recently"
        required: false
        type: boolean
        default: false
      fred_only:
        description: "Skip Census entirely this run"
        required: false
        type: boolean
        default: false
      skip_cbp:
        description: "Skip the optional County Business Patterns module"
        required: false
        type: boolean
        default: false
      force_permits:
        description: "Refresh Building Permits even if recently updated (slow: ~3,000 requests)"
        required: false
        type: boolean
        default: false
      skip_permits:
        description: "Skip the optional Building Permits module entirely"
        required: false
        type: boolean
        default: false
      permits_max_counties:
        description: "Cap counties checked for Building Permits (leave blank for all — use a small number for a fast manual test)"
        required: false
        type: string
        default: ""
      force_eia:
        description: "Refresh EIA electricity price even if recently updated"
        required: false
        type: boolean
        default: false
      skip_eia:
        description: "Skip the optional EIA electricity price module"
        required: false
        type: boolean
        default: false
      force_bls:
        description: "Refresh BLS QCEW wages even if recently updated (slow: ~3,000 requests)"
        required: false
        type: boolean
        default: false
      skip_bls:
        description: "Skip the optional BLS QCEW wage module entirely"
        required: false
        type: boolean
        default: false
      bls_max_counties:
        description: "Cap counties checked for BLS QCEW (leave blank for all — use a small number for a fast manual test)"
        required: false
        type: string
        default: ""
      force_nri:
        description: "Refresh FEMA National Risk Index even if recently updated"
        required: false
        type: boolean
        default: false
      skip_nri:
        description: "Skip the optional FEMA National Risk Index module entirely"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-economic-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # 45 min covered FRED+ACS+CBP alone. A full Building Permits or BLS QCEW
    # run each add roughly one HTTP round-trip per US county (~3,000), which
    # on their own rare trigger days (see permits_last_successful_update /
    # bls_last_successful_update gating) can each run 20-35 min longer than a
    # normal day's job. Their gates are independent (30 days vs 90 days) so
    # both landing on the same day is rare, but the timeout allows for it.
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The pipeline deliberately uses only the standard library (urllib, json)
      # so there is nothing to install and no dependency to audit.
      - name: Verify no third-party dependency is required
        run: python -c "import urllib.request, json, argparse, csv, io; print('stdlib only — no pip install needed')"

      - name: Run economic data tests
        run: python tests/test_economic_data.py

      - name: Fetch economic data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: |
          ARGS=""
          if [ "${{ inputs.force_census }}" = "true" ]; then ARGS="$ARGS --force-census"; fi
          if [ "${{ inputs.fred_only }}"    = "true" ]; then ARGS="$ARGS --fred-only";    fi
          if [ "${{ inputs.skip_cbp }}"     = "true" ]; then ARGS="$ARGS --skip-cbp";     fi
          if [ "${{ inputs.force_permits }}" = "true" ]; then ARGS="$ARGS --force-permits"; fi
          if [ "${{ inputs.skip_permits }}"  = "true" ]; then ARGS="$ARGS --skip-permits";  fi
          if [ -n "${{ inputs.permits_max_counties }}" ]; then
            ARGS="$ARGS --permits-max-counties ${{ inputs.permits_max_counties }}"
          fi
          if [ "${{ inputs.force_eia }}"    = "true" ]; then ARGS="$ARGS --force-eia";    fi
          if [ "${{ inputs.skip_eia }}"     = "true" ]; then ARGS="$ARGS --skip-eia";     fi
          if [ "${{ inputs.force_bls }}"    = "true" ]; then ARGS="$ARGS --force-bls";    fi
          if [ "${{ inputs.skip_bls }}"     = "true" ]; then ARGS="$ARGS --skip-bls";     fi
          if [ -n "${{ inputs.bls_max_counties }}" ]; then
            ARGS="$ARGS --bls-max-counties ${{ inputs.bls_max_counties }}"
          fi
          if [ "${{ inputs.force_nri }}"    = "true" ]; then ARGS="$ARGS --force-nri";    fi
          if [ "${{ inputs.skip_nri }}"     = "true" ]; then ARGS="$ARGS --skip-nri";     fi
          echo "running with args:$ARGS"
          python data/update_economic_data.py $ARGS

      # Independent re-validation of what is actually on disk. Exit 1 here means
      # committing would corrupt data, so the job fails before the commit step.
      - name: Validate generated output
        run: python data/update_economic_data.py --check

      # Existing repo validators, so an economic run can never leave the wider
      # dataset inconsistent.
      - name: Run existing data validators
        run: |
          python data/validate_platform_metadata.py || echo "platform metadata validator reported issues (non-blocking)"
          python data/validate_ai_companies.py      || echo "AI companies validator reported issues (non-blocking)"

      - name: Commit changed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/economy/
          if git diff --cached --quiet; then
            echo "No economic data changed — nothing to commit."
            exit 0
          fi
          # Summarise what actually moved, without leaking any request detail.
          SERIES=$(python -c "import json;print(json.load(open('data/economy/economic_metadata.json'))['fred_series_count'])" 2>/dev/null || echo "?")
          COUNTIES=$(python -c "import json;print(json.load(open('data/economy/economic_metadata.json'))['county_count'])" 2>/dev/null || echo "?")
          VINTAGE=$(python -c "import json;print(json.load(open('data/economy/economic_metadata.json'))['acs_vintage'])" 2>/dev/null || echo "?")
          PERMITSN=$(python -c "import json;print(json.load(open('data/economy/economic_metadata.json'))['permits_county_count'])" 2>/dev/null || echo "0")
          EIAN=$(python -c "import json;print(json.load(open('data/economy/economic_metadata.json'))['eia_state_count'])" 2>/dev/null || echo "0")
          BLSN=$(python -c "import json;print(json.load(open('data/economy/economic_metadata.json'))['bls_county_count'])" 2>/dev/null || echo "0")
          NRIN=$(python -c "import json;print(json.load(open('data/economy/economic_metadata.json'))['nri_county_count'])" 2>/dev/null || echo "0")
          # [skip ci] prevents a Pages redeploy loop: the frontend fetches these
          # files at runtime with cache:no-store, so a redeploy is not needed for
          # new numbers to appear.
          git commit -m "chore: refresh economic data — ${SERIES} FRED series, ${COUNTIES} counties, ACS ${VINTAGE}, permits ${PERMITSN}, EIA ${EIAN}, BLS ${BLSN}, NRI ${NRIN} [skip ci]"
          git push origin HEAD

      - name: Summary
        if: always()
        run: |
          if [ -f data/economy/economic_metadata.json ]; then
            python - <<'PY'
          import json
          m = json.load(open("data/economy/economic_metadata.json"))
          print(f"pipeline version : {m.get('pipeline_version')}")
          print(f"generated_at     : {m.get('generated_at')}")
          print(f"FRED series      : {m.get('fred_series_count')}")
          print(f"counties         : {m.get('county_count')}")
          print(f"states           : {m.get('state_count')}")
          print(f"ACS vintage      : {m.get('acs_vintage')}")
          print(f"CBP available    : {m.get('cbp_available')}")
          print(f"Permits available: {m.get('permits_available')} ({m.get('permits_county_count')} counties)")
          print(f"EIA available    : {m.get('eia_available')} ({m.get('eia_state_count')} states)")
          print(f"BLS available    : {m.get('bls_available')} ({m.get('bls_county_count')} counties)")
          print(f"NRI available    : {m.get('nri_available')} ({m.get('nri_county_count')} counties)")
          print(f"stale            : {m.get('stale')}")
          skipped = m.get("fred_skipped") or []
          if skipped:
              print(f"skipped series   : {[s.get('series_id') for s in skipped]}")
          w = m.get("warnings") or []
          print(f"warnings         : {len(w)}")
          for line in w[:15]:
              print(f"  - {line}")
          PY
          else
            echo "No metadata file produced."
          fi
